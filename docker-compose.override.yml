# Local development only. Production runs without this file (see docker-compose.prod.yml).
services:
  backend:
    environment:
      # Without RESEND_API_KEY, mails (and their codes) are printed to the backend log.
      NODE_ENV: development
      # Local only; production sets a long random code in the server env file.
      INITIAL_COURSE_JOIN_CODE: INF24B-local

  frontend:
    ports:
      - "8080:80"
