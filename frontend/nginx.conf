server {
  listen 80;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    # The backend's per-IP rate limit reads the client address from this header.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # These must never come from a cache: browsers check sw.js on every visit to find a new worker,
  # and the manifest differs per instance.
  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
