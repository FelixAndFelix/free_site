<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title data-de="FreeSite ist offline">FreeSite is offline</title>
    <style>
      :root { --bg: #eef0f3; --surface: #ffffff; --line: #dde1e7; --ink: #1d2230; --muted: #5d6474; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1218; --surface: #171b23; --line: #2a303c; --ink: #e7e9ee; --muted: #9aa1ae; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1rem;
        background: var(--bg); color: var(--ink); font: 1rem/1.5 system-ui, sans-serif; }
      main { width: 100%; max-width: 26rem; padding: 1.5rem; background: var(--surface);
        border: 1px solid var(--line); border-radius: 12px; }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; letter-spacing: -0.01em; }
      p { margin: 0 0 1rem; color: var(--muted); }
      button { min-height: 2.75rem; padding: 0.625rem 1rem; border: 1px solid var(--ink); border-radius: 8px;
        background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1 data-de="Du bist offline">You are offline</h1>
      <p data-de="FreeSite braucht eine Verbindung, um Stimmen zu laden und zu speichern. Prüfe deine Verbindung und versuche es dann noch einmal.">FreeSite needs a connection to load and save votes. Check your connection, then try again.</p>
      <button type="button" data-de="Erneut versuchen" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // The page is static and cached, so it cannot know the account language; the browser's will do.
      if ((navigator.language || "").toLowerCase().startsWith("de")) {
        document.documentElement.lang = "de";
        document.querySelectorAll("[data-de]").forEach(function (element) {
          element.textContent = element.getAttribute("data-de");
        });
      }
    </script>
  </body>
</html>
