name: free-site

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: free_site
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: free_site
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U free_site"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://free_site:${POSTGRES_PASSWORD}@database:5432/free_site
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-free_site <free@noreply.felixkarg.de>}
      APP_URL: ${APP_URL:-https://free.felixkarg.de}
      INITIAL_COURSE_JOIN_CODE: ${INITIAL_COURSE_JOIN_CODE:-}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend

volumes:
  database_data:
