name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches: [develop, main]

# The token only needs to read the code; nothing in CI writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: free_site
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: free_site
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U free_site"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://free_site:ci@localhost:5432/free_site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
